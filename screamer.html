<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>👀👀 Jeu de mémoire</title>
  <style>
    body { background:#000; color:#eee; font-family:Arial,sans-serif; text-align:center; overflow:hidden; }
    nav a { color:#eee; margin:0 15px; text-decoration:none; font-weight:bold; }
    nav a:hover { color:#00ff99; }
    .chat { max-width:600px; margin:50px auto; font-size:18px; }
    .message { margin:20px 0; }
    button {
      background:#00ff99;
      color:#000;
      border:none;
      padding:10px 20px;
      margin:10px;
      border-radius:5px;
      cursor:pointer;
      font-weight:bold;
    }
    button:hover {
      background:#00cc77;
    }
    #screamer {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      background:#000;
      display:none;
      justify-content:center;
      align-items:center;
      z-index:9999;
    }
    #screamer img {
      max-width:100%;
      height:auto;
      animation: shake 0.3s infinite;
    }
    @keyframes shake {
      0% { transform: translate(0, 0); }
      25% { transform: translate(5px, -5px); }
      50% { transform: translate(-5px, 5px); }
      75% { transform: translate(5px, 5px); }
      100% { transform: translate(0, 0); }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">Accueil</a>
    <a href="enigmes.html">Énigmes ❓</a>
    <a href="screamer.html">👀👀</a>
  </nav>

  <div class="chat" id="chat">
    <div class="message">👤 Salut, tu veux tester ton cerveau ?</div>
    <div class="message">👤 C’est un jeu de mémoire audio. Monte un peu le son 🔊 et écoute bien les numéros...</div>
    <button onclick="lancerJeu()">Commencer</button>
  </div>

  <!-- Screamer caché -->
  <div id="screamer">
    <img src="assets/scremer.png" alt="Screamer">
    <audio id="screamerAudio" src="assets/screamermp3.mp3" preload="auto"></audio>
  </div>

  <script>
    function lancerJeu(){
      const chat=document.getElementById("chat");
      chat.innerHTML=`<div class="message">👤 Écoute bien : 3... 7... 2... 9... 6...</div>
      <div class="message">👤 Tu te souviens ? (le sons peut metre du temps a charger)</div>`;

      // Attendre 5 secondes avant screamer
      setTimeout(() => {
        const screamer=document.getElementById("screamer");
        const audio=document.getElementById("screamerAudio");
        screamer.style.display="flex";
        audio.play();

        // Masquer le screamer après 10 secondes
        setTimeout(() => {
          screamer.style.display="none";
          audio.pause();
          audio.currentTime=0;
        }, 10000);
      }, 5000);
    }
  </script>
</body>
</html>
