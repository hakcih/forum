    .image-container img {

    .gif {

      width:80px;
      height:80px;
      cursor: pointer;
    }

      <!-- Plein de GIF -->

  <!-- Musique en continu -->
  <audio id="bgMusic" src="C:\Users\fatih\Desktop\forum\asset\fondmp3.mp3" autoplay loop></audio>

  <script>
    const gifs = document.querySelectorAll('.gif');

    gifs.forEach(gif => {
      // Sauvegarde la position initiale
      const initialTop = parseInt(gif.style.top) || 100;
      const initialLeft = parseInt(gif.style.left) || 100;

      gif.addEventListener('click', () => {
        gif.style.display = 'none';
        setTimeout(() => {
          // Nouvelle position limitée à ±300px autour de la position initiale
          const newTop = initialTop + (Math.random() * 600 - 300);
          const newLeft = initialLeft + (Math.random() * 600 - 300);

          gif.style.top = newTop + "px";
          gif.style.left = newLeft + "px";
          gif.style.display = 'block';
        }, 1000);
      });
    });
  </script>
</body>
