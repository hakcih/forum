<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Page de Ensar</title>
  <style>
    body { background:#000; color:#00ff99; font-family:Arial,sans-serif; text-align:center; overflow:hidden; }
    h1 { margin-top:20px; }
    .center-img { margin-top:40px; }
    .center-img img { max-width:300px; border:3px solid #00ff99; border-radius:10px; }
    .gif-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }
    .gif { position:absolute; width:80px; height:80px; animation: fall 6s linear infinite; }
    @keyframes fall { 0% { transform: translateY(-100px) rotate(0deg); opacity:1; } 100% { transform: translateY(100vh) rotate(360deg); opacity:0; } }
    a { color:#ffcc00; text-decoration:none; }
    a:hover { color:#fff; }
    .comments { max-width:600px; margin:30px auto; text-align:left; }
    .comment { background:#111; border:1px solid #00ff99; padding:10px; margin:10px 0; border-radius:5px; }
    textarea, input { width:100%; margin-top:10px; border-radius:5px; padding:10px; background:#0b0b0b; color:#eee; border:1px solid #00ff99; }
    button { margin-top:10px; padding:10px 20px; background:#00ff99; border:none; border-radius:5px; cursor:pointer; font-weight:bold; }
    button:hover { background:#00cc77; }
  </style>
</head>
<body>
  <h1>Bienvenue Ensar 🎉</h1>
  <p>Il ne voulait pas que je prenne une photo de lui.</p>

  <!-- ✅ Image centrale -->
  <div class="center-img">
    <img src="assets/montre.png" alt="Image dédiée à Ensar">
  </div>

  <!-- ✅ Conteneur des GIFs -->
  <div class="gif-container" id="gifContainer"></div>

  <!-- ✅ Musique de fond -->
  <audio id="bgMusic" src="assets/ensartheme.mp3" autoplay loop></audio>

  <!-- ✅ Section commentaires publics -->
  <div class="comments">
    <h2>💬 Commentaires publics</h2>
    <input id="authorInput" placeholder="Ton pseudo">
    <textarea id="commentInput" placeholder="Écris ton commentaire..."></textarea>
    <button id="sendBtn">Envoyer</button>
    <div id="commentList"></div>
  </div>

  <p><a href="enigmes.html">Retour en arrière</a></p>

  <script type="module">
    // Animation GIFs
    const gifContainer=document.getElementById("gifContainer");
    const gifs=["assets/the-frog.gif"];
    for(let i=0;i<80;i++){
      const gif=document.createElement("img");
      gif.src=gifs[Math.floor(Math.random()*gifs.length)];
      gif.className="gif";
      gif.style.left=Math.random()*100+"%";
      gif.style.animationDuration=(3+Math.random()*5)+"s";
      gifContainer.appendChild(gif);
    }

    // ✅ Firebase Firestore
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    // ⚠️ Mets ici ta vraie config Firebase (copie depuis la console Firebase)
    const firebaseConfig = {
      apiKey: "AIzaSyB4O4hojEvvTWFoF3ncCyDyg0fv0QpOmn4",
      authDomain: "callofhub-c588e.firebaseapp.com",
      projectId: "callofhub-c588e",
      storageBucket: "callofhub-c588e.appspot.com",
      messagingSenderId: "634398402018",
      appId: "1:634398402018:web:69076080346312b0c985bb",
      measurementId: "G-2LWBCQ2ZHZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Identifiant de la page (ici "ensar")
    const pageKey = "ensar";

    const list = document.getElementById("commentList");
    const authorInput = document.getElementById("authorInput");
    const messageInput = document.getElementById("commentInput");
    const sendBtn = document.getElementById("sendBtn");

    // Ajouter un commentaire
    async function addComment(){
      const author = authorInput.value.trim() || "Anonyme";
      const message = messageInput.value.trim();
      if(!message) return;
      await addDoc(collection(db, "comments"), {
        author,
        message,
        theme: pageKey,
        date: serverTimestamp()
      });
      messageInput.value = "";
    }

    // Charger les commentaires en temps réel
    function loadComments(){
      const q = query(
        collection(db, "comments"),
        where("theme", "==", pageKey),
        orderBy("date", "desc")
      );
      onSnapshot(q, snapshot => {
        list.innerHTML = "";
        snapshot.forEach(doc => {
          const data = doc.data();
          const div = document.createElement("div");
          div.className = "comment";
          const when = data.date?.toDate ? data.date.toDate().toLocaleString() : "";
          div.innerHTML = `<strong>${data.author}</strong> (${when})<br>${data.message}`;
          list.appendChild(div);
        });
      });
    }

    sendBtn.addEventListener("click", addComment);
    loadComments();
  </script>
</body>
</html>
