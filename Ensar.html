<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Page de Ensar</title>
  <style>
    body { background:#000; color:#00ff99; font-family:Arial,sans-serif; text-align:center; overflow:hidden; }
    h1 { margin-top:20px; }
    .center-img {
      margin-top:40px;
    }
    .center-img img {
      max-width:300px;
      border:3px solid #00ff99;
      border-radius:10px;
    }
    .gif-container {
      position:fixed;
      top:0; left:0;
      width:100%; height:100%;
      pointer-events:none;
      overflow:hidden;
    }
    .gif {
      position:absolute;
      width:80px;
      height:80px;
      animation: fall 6s linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-100px) rotate(0deg); opacity:1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity:0; }
    }
    a { color:#ffcc00; text-decoration:none; }
    a:hover { color:#fff; }
  </style>
</head>
<body>
  <h1>Bienvenue Ensar 🎉</h1>
  <p>il voulais pas que je prend une photo de lui.</p>

  <!-- ✅ Image centrale -->
  <div class="center-img">
    <img src="assets/montre.png" alt="Image dédiée à Ensar">
  </div>

  <!-- ✅ Conteneur des GIFs -->
  <div class="gif-container" id="gifContainer"></div>

  <!-- ✅ Musique de fond -->
  <audio id="bgMusic" src="assets/ensartheme.mp3" autoplay loop></audio>

 <p><a href="enigmes.html">Retour à en arrière</a></p>

  <script>
    const gifContainer=document.getElementById("gifContainer");
    const gifs=[
        "assets/the-frog.gif",
        "assets/the-frog.gif",
        "assets/the-frog.gif",
        "assets/the-frog.gif",
        "assets/the-frog.gif",
        "assets/the-frog.gif",
        "assets/the-frog.gif",
        "assets/the-frog.gif",
        "assets/the-frog.gif",
        "assets/the-frog.gif",
        "assets/the-frog.gif",
      // 👉 ajoute autant de GIFs que tu veux ici
    ];

    // Générer plein de GIFs aléatoires
    for(let i=0;i<80;i++){ // nombre de GIFs (ici 80, tu peux augmenter)
      const gif=document.createElement("img");
      gif.src=gifs[Math.floor(Math.random()*gifs.length)];
      gif.className="gif";
      gif.style.left=Math.random()*100+"%";
      gif.style.animationDuration=(3+Math.random()*5)+"s";
      gifContainer.appendChild(gif);
    }
  </script>
</body>
</html>
