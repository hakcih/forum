<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion / Profil</title>
  <style>
    body { font-family: Arial, sans-serif; background:#000; color:#eee; text-align:center; padding:40px; }
    h1 { color:#00ff99; }
    button { background:#00ff99; color:#000; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; margin:10px; }
    button:hover { background:#00cc77; }
    #user { margin-top:20px; font-size:18px; }
    .modo { color:#ffcc00; font-weight:bold; }
  </style>
</head>
<body>
  <h1>Connexion 🔒</h1>
  <button id="login">Se connecter avec Google</button>
  <button id="logout">Se déconnecter</button>
  <div id="user"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } 
      from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";

    // ✅ Ton config Firebase
    const firebaseConfig = {
      apiKey: "…",
      authDomain: "…",
      projectId: "…",
      storageBucket: "…",
      messagingSenderId: "…",
      appId: "…"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginBtn = document.getElementById("login");
    const logoutBtn = document.getElementById("logout");
    const userDiv = document.getElementById("user");

    // ✅ Connexion avec Google
    loginBtn.onclick = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Erreur de connexion :", error);
        alert("❌ Impossible de se connecter.");
      }
    };

    // ✅ Déconnexion
    logoutBtn.onclick = async () => {
      await signOut(auth);
    };

    // ✅ Surveiller l'état de connexion
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // Afficher infos utilisateur
        let html = `Connecté en tant que <b>${user.displayName}</b><br>Email : ${user.email}`;
        
        // Exemple : si ton compte modo est reconnu par email
        if (user.email === "tonemailmodo@gmail.com") {
          html += `<br><span class="modo">⭐ Compte MODO reconnu</span>`;
        }

        userDiv.innerHTML = html;
      } else {
        userDiv.innerHTML = "Déconnecté";
      }
    });
  </script>
</body>
</html>
