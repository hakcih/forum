<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Eserg Egg — Galerie</title>
  <style>
    body {
      background:#000;
      color:#00ff99;
      font-family:Arial,sans-serif;
      text-align:center;
    }
    header { padding:20px; }
    nav a { color:#eee; margin:0 15px; text-decoration:none; font-weight:bold; }
    nav a:hover { color:#00ff99; }
    .grid { display:grid; grid-template-columns:repeat(2, minmax(200px, 1fr)); gap:20px; max-width:700px; margin:30px auto; }
    .card { background:#111; border:2px solid #00ff99; border-radius:10px; padding:10px; transition: transform 0.3s ease; }
    .card img { width:100%; height:auto; border-radius:8px; transition: transform 0.4s ease, filter 0.4s ease; }
    .card img:hover { transform: scale(1.1) rotate(2deg); filter: brightness(1.2) saturate(1.5); }
    .caption { color:#ffcc00; margin-top:8px; }
    a { color:#ffcc00; text-decoration:none; }
    a:hover { color:#fff; }
    .comments { max-width:600px; margin:30px auto; text-align:left; }
    .comment { background:#111; border:1px solid #00ff99; padding:10px; margin:10px 0; border-radius:5px; }
    textarea, input { width:100%; margin-top:10px; border-radius:5px; padding:10px; background:#0b0b0b; color:#eee; border:1px solid #00ff99; }
    button { margin-top:10px; padding:10px 20px; background:#00ff99; border:none; border-radius:5px; cursor:pointer; font-weight:bold; }
    button:hover { background:#00cc77; }
  </style>
</head>
<body>
  <header>
    <h1>Eserg Egg 🥚</h1>
    <p>Galerie provisoire — deux photos pour commencer</p>
  </header>

  <nav>
    <a href="index.html">Accueil</a>
    <a href="boutique.html">Boutique</a>
    <a href="forum.html">Forum</a>
    <a href="don.html">Dons</a>
    <a href="dedicace.html">Dédicace</a>
    <a href="blog.html">Actualités / Blog 📰</a>
    <a href="minijeux.html">Mini‑jeux 🎮</a>
    <a href="enigmes.html">Énigmes ❓</a>
  </nav>

  <main>
    <div class="grid">
      <div class="card">
        <img src="assets/egg1.png" alt="Eserg Egg photo 1">
        <div class="caption">Photo 1 — Eserg Egg</div>
      </div>
      <div class="card">
        <img src="assets/egg2.png" alt="Eserg Egg photo 2">
        <div class="caption">Photo 2 — Eserg Egg</div>
      </div>
    </div>

    <!-- ✅ Section commentaires publics -->
    <div class="comments">
      <h2>💬 Commentaires publics</h2>
      <input id="authorInput" placeholder="Ton pseudo">
      <textarea id="commentInput" placeholder="Écris ton commentaire..."></textarea>
      <button id="sendBtn">Envoyer</button>
      <div id="commentList"></div>
    </div>

    <p><a href="index.html">Retour à l’accueil</a></p>
  </main>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp } 
      from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    // ⚠️ Mets ici ta vraie config Firebase (celle que tu utilises déjà pour forum.html)
    const firebaseConfig = {
      apiKey: "AIzaSyXXXXXXX",
      authDomain: "callofhub.firebaseapp.com",
      projectId: "callofhub",
    };

    // Init Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Identifiant de la page (ici "egg")
    const pageKey = "egg";

    const list = document.getElementById("commentList");
    const authorInput = document.getElementById("authorInput");
    const messageInput = document.getElementById("commentInput");
    const sendBtn = document.getElementById("sendBtn");

    // Ajouter un commentaire
    async function addComment(){
      const author = authorInput.value.trim() || "Anonyme";
      const message = messageInput.value.trim();
      if(!message) return;
      await addDoc(collection(db, "comments"), {
        author,
        message,
        theme: pageKey,
        date: serverTimestamp()
      });
      messageInput.value = "";
    }

    // Charger les commentaires en temps réel
    function loadComments(){
      const q = query(
        collection(db, "comments"),
        where("theme", "==", pageKey),
        orderBy("date", "desc")
      );
      onSnapshot(q, snapshot => {
        list.innerHTML = "";
        snapshot.forEach(doc => {
          const data = doc.data();
          const div = document.createElement("div");
          div.className = "comment";
          const when = data.date?.toDate ? data.date.toDate().toLocaleString() : "";
          div.innerHTML = `<strong>${data.author}</strong> (${when})<br>${data.message}`;
          list.appendChild(div);
        });
      });
    }

    sendBtn.addEventListener("click", addComment);
    loadComments();
  </script>
</body>
</html>
